spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
server:
  port:  ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dearest-shop-jwt-secret-key-2026-very-long-string}

frontend:
  url: http://localhost:5173

file:
  fileDir: "${FILE_DIR:C:/Users/USER/Desktop/Study/images/}"

logging:
  level:
    org.hibernate.SQL: debug