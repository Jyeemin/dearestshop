spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/dearestshop
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        #        show_sql: true
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
jwt:
  secret: dearest-shop-jwt-secret-key-2026-very-long-string
file:
  fileDir: "C:/Users/USER/Desktop/Study/images/"
logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace
#  org.hibernate.type: trace #스프링 부트 2.x, hibernate5
#  org.hibernate.orm.jdbc.bind: trace #스프링 부트 3.x, hibernate6